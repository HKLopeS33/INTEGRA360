# Authenticated company users (token read from the Authorization header and validated).
[functions.mercado-pago-pix]
verify_jwt = true

# Public/anonymous endpoints — called by customers on the public delivery link
# and by Mercado Pago's webhook, neither of which carries a Supabase user JWT.
[functions.mercado-pago-public-pix]
verify_jwt = false

[functions.mercado-pago-webhook]
verify_jwt = false

# Chamada pelo cardápio público com a chave publishable (não é JWT).
# O modo DIAGNOSTICO valida o usuário SUPER dentro da própria função.
[functions.whatsapp-notify]
verify_jwt = false
